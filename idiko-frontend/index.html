<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Android / Browser Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icon-512.png"
    />

    <!-- Apple / iPhone Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- iOS Standalone Web App -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="IDiko"
    />

    <title>IDiko</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
